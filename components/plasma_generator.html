<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plasma Video Recorder</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
      font-family: monospace;
    }
    #container {
      width: 1920px;
      height: 1080px;
      margin: 20px auto;
      background: #000;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
      background: #00ff00;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h1>🎬 Plasma Video Recorder</h1>
    <p>Формат: Full HD 1920×1080 (16:9)</p>
    <button id="startBtn">▶️ Начать запись</button>
    <button id="stopBtn" disabled>⏹️ Остановить</button>
    <div id="status">Готов к записи</div>
  </div>
  
  <div id="container"></div>

  <script type="module">
    import { Renderer, Program, Mesh, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.6/+esm';

    const vertex = `#version 300 es
precision highp float;
in vec2 position;
in vec2 uv;
out vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}`;

    const fragment = `#version 300 es
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec3 uCustomColor;
uniform float uSpeed;
uniform float uScale;
uniform float uOpacity;
out vec4 fragColor;

void mainImage(out vec4 o, vec2 C) {
  vec2 center = iResolution.xy * 0.5;
  C = (C - center) / uScale + center;
  
  float i, d, z, T = iTime * uSpeed;
  vec3 O, p, S;

  for (vec2 r = iResolution.xy, Q; ++i < 60.; O += o.w/d*o.xyz) {
    p = z*normalize(vec3(C-.5*r,r.y)); 
    p.z -= 4.; 
    S = p;
    d = p.y-T;
    
    p.x += .4*(1.+p.y)*sin(d + p.x*0.1)*cos(.34*d + p.x*0.05); 
    Q = p.xz *= mat2(cos(p.y+vec4(0,11,33,0)-T)); 
    z+= d = abs(sqrt(length(Q*Q)) - .25*(5.+S.y))/3.+8e-4; 
    o = 1.+sin(S.y+p.z*.5+S.z-length(S-p)+vec4(2,1,0,8));
  }
  
  o.xyz = tanh(O/1e4);
}

bool finite1(float x){ return !(isnan(x) || isinf(x)); }
vec3 sanitize(vec3 c){
  return vec3(
    finite1(c.r) ? c.r : 0.0,
    finite1(c.g) ? c.g : 0.0,
    finite1(c.b) ? c.b : 0.0
  );
}

void main() {
  vec4 o = vec4(0.0);
  mainImage(o, gl_FragCoord.xy);
  vec3 rgb = sanitize(o.rgb);
  
  float intensity = (rgb.r + rgb.g + rgb.b) / 3.0;
  vec3 finalColor = intensity * uCustomColor;
  
  float alpha = length(rgb) * uOpacity;
  fragColor = vec4(finalColor, alpha);
}`;

    const container = document.getElementById('container');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    // WebGL Setup
    const renderer = new Renderer({
      webgl: 2,
      alpha: false,
      antialias: true,
      width: 1920,
      height: 1080,
      dpr: 1
    });
    
    const gl = renderer.gl;
    const canvas = gl.canvas;
    canvas.style.display = 'block';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    container.appendChild(canvas);

    const geometry = new Triangle(gl);
    const program = new Program(gl, {
      vertex,
      fragment,
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new Float32Array([1920, 1080]) },
        uCustomColor: { value: new Float32Array([0.5333, 0.1176, 0.9451]) }, //<------ цвет плазмы
        uSpeed: { value: 0.4 },
        uScale: { value: 1.0 },
        uOpacity: { value: 1.0 }
      }
    });

{/*
hex_color = "#881ef1"

# убираем #
hex_color = hex_color.lstrip("#")

# переводим в RGB
r = int(hex_color[0:2], 16)
g = int(hex_color[2:4], 16)
b = int(hex_color[4:6], 16)

# нормализация в диапазон 0–1
rgb_normalized = [round(r/255, 4), round(g/255, 4), round(b/255, 4)]

print(rgb_normalized)
*/}

    const mesh = new Mesh(gl, { geometry, program });

    // Video Recording
    let mediaRecorder;
    let recordedChunks = [];
    let animationId;
    let startTime;

    const DURATION = 30; // секунд
    const FPS = 60;

    function startRecording() {
      recordedChunks = [];
      
      const stream = canvas.captureStream(FPS);
      mediaRecorder = new MediaRecorder(stream, {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 25000000 // 25 Mbps для высокого качества
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `plasma_fullhd_${Date.now()}.webm`;
        a.click();
        
        status.textContent = '✅ Видео сохранено!';
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };

      mediaRecorder.start();
      startTime = performance.now();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.textContent = `🔴 Запись... 0/${DURATION}s`;
      
      animate();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        cancelAnimationFrame(animationId);
      }
    }

    function animate() {
      const elapsed = (performance.now() - startTime) / 1000;
      
      program.uniforms.iTime.value = elapsed;
      program.uniforms.iResolution.value[0] = gl.drawingBufferWidth;
      program.uniforms.iResolution.value[1] = gl.drawingBufferHeight;
      
      renderer.render({ scene: mesh });
      
      status.textContent = `🔴 Запись... ${elapsed.toFixed(1)}/${DURATION}s`;
      
      if (elapsed < DURATION) {
        animationId = requestAnimationFrame(animate);
      } else {
        stopRecording();
      }
    }

    // Initial render
    renderer.render({ scene: mesh });

    startBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
  </script>
</body>
</html>
